# Drop-in tmux bindings for floating offline voice dictation into any active TUI pane.
# Append to ~/.tmux.conf and reload with: tmux source-file ~/.tmux.conf
# Override language globally via WHISPER_LANG (default: auto), or pass a 2nd arg (e.g. 'en').

bind-key v display-popup -E -w 85% -h 10 -T " Voice Dictation (offline) " "voice-tui '#{pane_id}'"
bind-key -n M-v display-popup -E -w 85% -h 10 -T " Voice Dictation (offline) " "voice-tui '#{pane_id}'"
