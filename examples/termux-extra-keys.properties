# Add this entry to your ~/.termux/termux.properties extra-keys row,
# then apply live with: termux-reload-settings
#
# Single tap sends Ctrl+b v (opens tmux voice-tui popup).
# Swipe up sends Ctrl+c (cancel recording).

{macro: "CTRL b v", display: "VOICE", popup: {macro: "CTRL c", display: "Stop"}}
